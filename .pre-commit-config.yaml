repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.5
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --strict src scripts docs tests
        language: system
        pass_filenames: false
        always_run: true


  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--fail-under=100, -vv, src, scripts, docs, tests]
        pass_filenames: false

  - repo: local
    hooks:
      - id: check-docstrings
        name: check-docstrings
        entry: uv run python scripts/check_docstrings.py src scripts docs tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: check-python-loc
        name: check-python-loc
        entry: scripts/check_python_loc.sh
        language: script
        types: [python]

      - id: prevent-hardcoded-frameworks
        name: prevent-hardcoded-frameworks
        entry: scripts/prevent_hardcoded_frameworks.sh
        language: script
        types: [python]
        files: ^src/

      - id: validate-snapshot-grounding
        name: validate-snapshot-grounding
        entry: uv run python scripts/validate_snapshot_grounding.py --strict --snapshots-dir ../ml-framework-snapshots --snapshots-dir ../ml-ecosystem-snapshots --snapshots-dir ../ml-switcheroo-ir
        language: system
        pass_filenames: false
        always_run: true

      - id: audit-against-snapshots
        name: audit-against-snapshots
        entry: uv run python scripts/audit_against_snapshots.py --strict --snapshots-dir ../ml-framework-snapshots --snapshots-dir ../ml-ecosystem-snapshots --snapshots-dir ../ml-switcheroo-ir
        language: system
        pass_filenames: false
        always_run: true

      - id: audit-rdna-grounding
        name: audit-rdna-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework rdna --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/rdna.*|src/ml_switcheroo/frameworks/rdna\.py|src/ml_switcheroo/core/compiler/backends/rdna/.*)$
        pass_filenames: false

      - id: audit-sass-grounding
        name: audit-sass-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework nvidia_sass --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/nvidia_sass.*|src/ml_switcheroo/frameworks/nvidia_sass\.py|src/ml_switcheroo/core/compiler/backends/nvidia_sass/.*)$
        pass_filenames: false

      - id: audit-torch-grounding
        name: audit-torch-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework torch --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*torch.*|src/ml_switcheroo/frameworks/torch.*\.py)$
        pass_filenames: false

      - id: audit-jax-grounding
        name: audit-jax-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework jax --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*jax.*|src/ml_switcheroo/frameworks/jax.*\.py|src/ml_switcheroo/frameworks/flax.*\.py)$
        pass_filenames: false

      - id: audit-flax-nnx-grounding
        name: audit-flax-nnx-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework flax_nnx --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*flax.*|src/ml_switcheroo/frameworks/flax.*\.py)$
        pass_filenames: false

      - id: audit-mlx-grounding
        name: audit-mlx-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework mlx --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*mlx.*|src/ml_switcheroo/frameworks/mlx.*\.py)$
        pass_filenames: false

      - id: audit-keras-grounding
        name: audit-keras-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework keras --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*keras.*|src/ml_switcheroo/frameworks/keras.*\.py)$
        pass_filenames: false

      - id: audit-tensorflow-grounding
        name: audit-tensorflow-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework tensorflow --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*tensorflow.*|src/ml_switcheroo/frameworks/tensorflow.*\.py)$
        pass_filenames: false

      - id: audit-numpy-grounding
        name: audit-numpy-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework numpy --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*numpy.*|src/ml_switcheroo/frameworks/numpy.*\.py)$
        pass_filenames: false

      - id: audit-paxml-grounding
        name: audit-paxml-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework paxml --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*paxml.*|src/ml_switcheroo/frameworks/paxml.*\.py)$
        pass_filenames: false

      - id: audit-stablehlo-grounding
        name: audit-stablehlo-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework stablehlo --snapshots-dir ../ml-framework-snapshots
        language: system
        files: ^(src/ml_switcheroo/semantics/.*stablehlo.*|src/ml_switcheroo/frameworks/stablehlo\.py|src/ml_switcheroo/core/mlir/.*)$
        pass_filenames: false

      - id: audit-ir-grounding
        name: audit-ir-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework ir --snapshots-dir ../ml-framework-snapshots --snapshots-dir ../ml-ecosystem-snapshots --snapshots-dir ../ml-switcheroo-ir
        language: system
        files: ^(src/ml_switcheroo/semantics/.*ir.*|src/ml_switcheroo/frameworks/ir\.py|src/ml_switcheroo/core/compiler/backends/ir\.py|src/ml_switcheroo/core/compiler/frontends/ir\.py)$
        pass_filenames: false

      - id: audit-mlir-spec
        name: audit-mlir-spec
        entry: uv run python scripts/audit_mlir_spec.py
        language: system
        files: ^src/ml_switcheroo/core/mlir/
        pass_filenames: false

      - id: audit-stablehlo-spec
        name: audit-stablehlo-spec
        entry: uv run python scripts/audit_stablehlo_spec.py
        language: system
        files: ^src/ml_switcheroo/core/mlir/
        pass_filenames: false

      - id: pytest-deprecation-warnings
        name: pytest-deprecation-warnings
        entry: uv run pytest -n auto -W error::DeprecationWarning
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-coverage
        name: pytest-coverage
        entry: uv run pytest -n auto --cov=src --cov-fail-under=100 --cov-branch -W error::DeprecationWarning tests
        language: system
        pass_filenames: false
        always_run: true
