repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.5
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: []
        additional_dependencies: [ types-PyYAML, pydantic ]
        exclude: ^tests/



  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [ --fail-under=100, src/ml_switcheroo ]
        pass_filenames: false

  - repo: local
    hooks:
      - id: check-python-loc
        name: check-python-loc
        entry: scripts/check_python_loc.sh
        language: script
        types: [python]

      - id: prevent-hardcoded-frameworks
        name: prevent-hardcoded-frameworks
        entry: scripts/prevent_hardcoded_frameworks.sh
        language: script
        types: [python]
        files: ^src/

      - id: audit-against-snapshots
        name: audit-against-snapshots
        entry: uv run python scripts/audit_against_snapshots.py --strict
        language: system
        files: ^(src/ml_switcheroo/semantics/.*|src/ml_switcheroo/frameworks/.*\.py|src/ml_switcheroo/core/compiler/backends/.*|docs/.*operations.*\.yaml)$
        pass_filenames: false

      - id: audit-rdna-grounding
        name: audit-rdna-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework rdna
        language: system
        files: ^(src/ml_switcheroo/semantics/rdna.*|src/ml_switcheroo/frameworks/rdna\.py|src/ml_switcheroo/core/compiler/backends/rdna/.*)$
        pass_filenames: false

      - id: audit-sass-grounding
        name: audit-sass-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework nvidia_sass
        language: system
        files: ^(src/ml_switcheroo/semantics/nvidia_sass.*|src/ml_switcheroo/frameworks/nvidia_sass\.py|src/ml_switcheroo/core/compiler/backends/nvidia_sass/.*)$
        pass_filenames: false

      - id: audit-torch-grounding
        name: audit-torch-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework torch
        language: system
        files: ^(src/ml_switcheroo/semantics/.*torch.*|src/ml_switcheroo/frameworks/torch.*\.py)$
        pass_filenames: false

      - id: audit-jax-grounding
        name: audit-jax-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework jax
        language: system
        files: ^(src/ml_switcheroo/semantics/.*jax.*|src/ml_switcheroo/frameworks/jax.*\.py|src/ml_switcheroo/frameworks/flax.*\.py)$
        pass_filenames: false

      - id: audit-mlx-grounding
        name: audit-mlx-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework mlx
        language: system
        files: ^(src/ml_switcheroo/semantics/.*mlx.*|src/ml_switcheroo/frameworks/mlx.*\.py)$
        pass_filenames: false

      - id: audit-keras-grounding
        name: audit-keras-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework keras
        language: system
        files: ^(src/ml_switcheroo/semantics/.*keras.*|src/ml_switcheroo/frameworks/keras.*\.py)$
        pass_filenames: false

      - id: audit-ir-grounding
        name: audit-ir-grounding
        entry: uv run python scripts/audit_against_snapshots.py --strict --framework ir
        language: system
        files: ^(src/ml_switcheroo/semantics/.*ir.*|src/ml_switcheroo/frameworks/ir\.py|src/ml_switcheroo/core/compiler/backends/ir\.py|src/ml_switcheroo/core/compiler/frontends/ir\.py)$
        pass_filenames: false

      - id: audit-mlir-spec
        name: audit-mlir-spec
        entry: uv run python scripts/audit_mlir_spec.py
        language: system
        files: ^src/ml_switcheroo/core/mlir/
        pass_filenames: false

      - id: audit-stablehlo-spec
        name: audit-stablehlo-spec
        entry: uv run python scripts/audit_stablehlo_spec.py
        language: system
        files: ^src/ml_switcheroo/core/mlir/
        pass_filenames: false

      - id: pytest-coverage
        name: pytest-coverage
        entry: uv run pytest -n auto --cov=src --cov-fail-under=100 --cov-branch tests
        language: system
        pass_filenames: false
        always_run: true
