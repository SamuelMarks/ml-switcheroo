[tox]
envlist = py310, py311, py312, py313, py314
isolated_build = True

[testenv]
deps =
    -r requirements.txt
    -r docs/docs-requirements.txt
    -r test-requirements.txt
extras =
    test
commands =
    pytest -n auto --durations=10 tests {posargs}

[testenv:py312]
deps =
    -r requirements.txt
    -r docs/docs-requirements.txt
    -r test-requirements.txt
extras =
    test
commands =
    pytest -n auto --durations=10 --cov=src --cov=scripts --cov=docs --cov-fail-under=100 --cov-branch -W error::DeprecationWarning tests {posargs}
    python scripts/check_function_coverage.py
    python scripts/lint_typing.py src scripts docs tests
    mypy --strict src scripts docs tests
    interrogate -c pyproject.toml --fail-under 100 src scripts docs tests
    python scripts/check_docstrings.py src scripts docs tests
