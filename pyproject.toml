[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "ml_switcheroo"
description = "Universal Compiler for Deep Learning: From High-Level APIs to Hardware Assembly"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[tool.hatch.version]
path = "src/ml_switcheroo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_switcheroo"]
include-package-data = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
test = ["test-requirements.txt"]
docs = ["docs/docs-requirements.txt"]

[project.scripts]
ml_switcheroo = "ml_switcheroo.cli.__main__:main"
"🔄🦘" = "ml_switcheroo.cli.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::FutureWarning:keras.src.export.tf2onnx_lib",
    "ignore:.*np\\.object.*:FutureWarning",
    "ignore:In the future .*np\\.object.* will be defined:FutureWarning",
    "ignore::FutureWarning:tensorflow.*",
    "ignore::FutureWarning:keras.*",
    "ignore::FutureWarning:tensorboard.*",
    "ignore::FutureWarning:google.api_core.*",
    "ignore::FutureWarning:google.auth.*",
    "ignore::FutureWarning:google.oauth2.*",
    "ignore::DeprecationWarning:tensorflow.lite.python.util",
    "ignore::DeprecationWarning:jax._src.deprecations",

    "ignore::DeprecationWarning:matplotlib.*",
    "ignore:.*ml_switcheroo\\.cli\\.__main__.*:RuntimeWarning",
    "ignore:.*found in sys\\.modules after import of package 'scripts'.*:RuntimeWarning",

#    "error"
]

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
]
line-length = 122
indent-width = 2
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D", "UP006", "UP007", "UP045", "TID251"]
ignore = ["D200", "D205", "D415"]
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"operator.attrgetter".msg = "Do not use operator.attrgetter; use explicit protocols or typed attributes."
"operator.itemgetter".msg = "Do not use operator.itemgetter; use explicit indexing or typed lookups."
"operator.methodcaller".msg = "Do not use operator.methodcaller; call typed methods directly."
"_operator.attrgetter".msg = "Do not use _operator.attrgetter; use explicit protocols or typed attributes."
"_operator.itemgetter".msg = "Do not use _operator.itemgetter; use explicit indexing or typed lookups."
"_operator.methodcaller".msg = "Do not use _operator.methodcaller; call typed methods directly."
"typing.Any".msg = "Do not use typing.Any; use explicit types or protocols."
"typing.cast".msg = "Do not use typing.cast; use explicit type narrowing."
"typing_extensions.Any".msg = "Do not use typing_extensions.Any; use explicit types or protocols."
"typing_extensions.cast".msg = "Do not use typing_extensions.cast; use explicit type narrowing."

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.mypy]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_any_explicit = true
disallow_subclassing_any = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
disable_error_code = ["import-untyped", "import-not-found", "override"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.gold.*", "tests.examples.*"]
disallow_subclassing_any = false


[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 100
exclude = ["setup.py", "docs", "build", "onnx", "array-api", "out.py"]
ignore-regex = []
color = true
omit-covered-files = false
generate-badge = "."
badge-format = "svg"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.uv]
override-dependencies = [
    "cdd @ https://github.com/offscale/cdd-python/releases/download/v0.0.99rc46/cdd-0.0.99rc46-py3-none-any.whl",
    "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.6/ml_switcheroo_ir-0.0.6-py3-none-any.whl",
]
