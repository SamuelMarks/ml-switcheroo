[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "ml_switcheroo"
version = "0.0.2"
description = "Deterministic AST Transpiler for PyTorch <-> JAX"
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_switcheroo"]
include-package-data = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
test = ["test-requirements.txt"]
docs = ["docs/docs-requirements.txt"]

[project.scripts]
ml_switcheroo = "ml_switcheroo.cli.__main__:main"
"🔄🦘" = "ml_switcheroo.cli.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::FutureWarning:keras.src.export.tf2onnx_lib",
    "ignore:.*np\\.object.*:FutureWarning",
    "ignore:In the future .*np\\.object.* will be defined:FutureWarning",
    "ignore::FutureWarning:tensorflow.*",
    "ignore::FutureWarning:keras.*",
    "ignore::FutureWarning:tensorboard.*",

#    "error"
]

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
]
line-length = 122
indent-width = 2
#target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D200", "D205", "D415"]
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]
plugins = ["pydantic.mypy"]


[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = false
