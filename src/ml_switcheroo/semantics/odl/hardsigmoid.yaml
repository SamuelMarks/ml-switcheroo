operation: hardsigmoid
description: Apply the Hardsigmoid function element-wise.
std_args:
- name: inplace
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'False'
- name: input
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
variants:
  torch:
    api: torch.nn.functional.hardsigmoid
    args:
      input: input
  jax:
    api: jax.nn.hard_sigmoid
    args: {}
  mlx:
    api: mlx.nn.hardsigmoid
    args: {}
  keras:
    api: keras.activations.hard_sigmoid
    args: {}
