description: "Samples from a two-parameter Weibull distribution.\n\nExample:\n\n \
  \   >>> # xdoctest: +IGNORE_WANT(\"non-deterministic\")\n    >>> m = Weibull(torch.tensor([1.0]),\
  \ torch.tensor([1.0]))\n    >>> m.sample()  # sample from a Weibull distribution\
  \ with scale=1, concentration=1\n    tensor([ 0.4784])\n\nArgs:\n    scale (float\
  \ or Tensor): Scale parameter of distribution (lambda).\n    concentration (float\
  \ or Tensor): Concentration parameter of distribution (k/shape).\n    validate_args\
  \ (bool, optional): Whether to validate arguments. Default: None."
