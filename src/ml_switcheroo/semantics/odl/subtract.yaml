operation: subtract
description: subtract(input, other, *, alpha=1, out=None) -> Tensor
std_args:
- name: input
  kind: positional_or_keyword
  is_variadic: false
  type: Any
- name: other
  kind: positional_or_keyword
  is_variadic: false
  type: Any
- name: alpha
  kind: keyword_only
  is_variadic: false
  type: Any
  default: '1'
- name: out
  kind: keyword_only
  is_variadic: false
  type: Any
variants:
  torch:
    api: torch.subtract
    args:
      input: input
      other: other
  jax:
    api: jax.numpy.subtract
    macro_template: jax.numpy.subtract({input}, {other})
    args: {}
  mlx:
    api: mlx.core.subtract
    args:
      a: a
      b: b
  stablehlo:
    api: stablehlo.subtract
    args:
      lhs: lhs
      rhs: rhs
  rdna:
    api: v_sub_f32
    args: {}
  nvidia_sass:
    api: FSUB
    args: {}
  keras:
    api: keras.ops.subtract
    args: {}
