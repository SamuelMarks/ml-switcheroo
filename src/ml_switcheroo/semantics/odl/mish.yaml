operation: mish
description: Apply the Mish function, element-wise.
std_args:
- name: input
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: inplace
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'False'
variants:
  torch:
    api: torch.nn.functional.mish
    args:
      input: input
  mlx:
    api: mlx.nn.mish
    args:
      x: x
  keras:
    api: keras.activations.mish
    args:
      x: x
