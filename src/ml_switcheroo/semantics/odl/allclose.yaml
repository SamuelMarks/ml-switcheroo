  = 1e-08, equal_nan: bool = False) -> bool'
std_args:
- name: input
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: other
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: rtol
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: 1e-05
- name: atol
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: 1e-08
- name: equal_nan
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: 'False'
variants:
  torch:
    api: torch.allclose
    args:
      input: input
      other: other
  jax:
    api: jax.numpy.allclose
    args:
      a: a
      b: b
  mlx:
    api: mlx.core.allclose
    args:
      a: a
      b: b
