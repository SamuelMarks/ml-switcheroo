operation: Addmm
variants:
  paxml:
    dispatch_rules: []
    macro_template: jnp.add({beta} * {input}, {alpha} * jnp.matmul({mat1}, {mat2}))
    pack_as: Tuple
    required_imports:
    - import jax.numpy as jnp
  flax_nnx:
    dispatch_rules: []
    macro_template: jnp.add({beta} * {input}, {alpha} * jnp.matmul({mat1}, {mat2}))
    pack_as: Tuple
    required_imports:
    - import jax.numpy as jnp
  mlx:
    api: mlx.core.addmm
    args:
      c: c
      a: a
      b: b
std_args:
- name: c
  kind: positional_only
  is_variadic: false
  type: Any
- name: a
  kind: positional_only
  is_variadic: false
  type: Any
- name: b
  kind: positional_only
  is_variadic: false
  type: Any
- name: alpha
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: '1.0'
- name: beta
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: '1.0'
- name: stream
  kind: keyword_only
  is_variadic: false
  type: Any
