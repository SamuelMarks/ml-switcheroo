description: Calculates an implementation-dependent approximation of exponentiation
  by raising each element ``x1_i`` (the base) of the input array ``x1`` to the power
  of ``x2_i`` (the exponent), where ``x2_i`` is the corresponding element of the input
  array ``x2``.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int, float, complex]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int, float, complex]
variants: {}
operation: pow
