operation: STFT
description: Short-time Fourier transform (STFT).
std_args:
- name: input
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: n_fft
  kind: positional_or_keyword
  is_variadic: false
  type: int
- name: hop_length
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''None`` (treated as equal to ``floor(n_fft / 4)``)'''
- name: win_length
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''None``  (treated as equal to :attr:`n_fft`)'''
- name: window
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
  default: '''None`` (treated as window of all :math:`1` s)'''
- name: center
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'True'
- name: pad_mode
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''reflect'''
- name: normalized
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'False'
- name: onesided
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: '''True`` for real :attr:`input` and :attr:`window`, ``False`` otherwise'''
- name: return_complex
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: '''```(None)```'''
- name: align_to_window
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''```(None)```'''
variants:
  torch:
    api: torch.stft
    args:
      input: input
      n_fft: n_fft
  keras:
    api: keras.initializers.STFT
    args: {}
