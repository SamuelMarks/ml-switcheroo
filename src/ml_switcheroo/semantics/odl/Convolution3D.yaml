  default: "'```(\\'Applies a 3D convolution over an input signal composed of several\
    \ input\\\\n    planes.\\\\n\\\\n    In the simplest case, the output value of\
    \ the layer with input size :math:`(N, C_{in}, D, H, W)`\\\\n    and output :math:`(N,\
    \ C_{out}, D_{out}, H_{out}, W_{out})` can be precisely described as:\\\\n\\\\\
    n    .. math::\\\\n        out(N_i, C_{out_j}) = bias(C_{out_j}) +\\\\n      \
    \                          \\\\\\\\sum_{k = 0}^{C_{in} - 1} weight(C_{out_j},\
    \ k) \\\\\\\\star input(N_i, k)\\\\n\\\\n    where :math:`\\\\\\\\star` is the\
    \ valid 3D `cross-correlation`_ operator\\\\n    \\' + \"\\\\n\\\\n    This module\
    \ supports :ref:`TensorFloat32<tf32_on_ampere>`.\\\\n\\\\n    On certain ROCm\
    \ devices, when using float16 inputs this module will use :ref:`different precision<fp16_on_mi200>`\
    \ for backward.\\\\n\\\\n    * :attr:`stride` controls the stride for the cross-correlation.\\\
    \\n\\\\n    * :attr:`padding` controls the amount of padding applied to the input.\
    \ It\\\\n      can be either a string {{\\'valid\\', \\'same\\'}} or a tuple of\
    \ ints giving the\\\\n      amount of implicit padding applied on both sides.\\\
    \\n\\\\n    * :attr:`dilation` controls the spacing between the kernel points;\
    \ also known as the \xE0 trous algorithm.\\\\n      It is harder to describe,\
    \ but this `link`_ has a nice visualization of what :attr:`dilation` does.\\\\\
    n\\\\n\\\\n    {groups_note}\\\\n\\\\n    The parameters :attr:`kernel_size`,\
    \ :attr:`stride`, :attr:`padding`, :attr:`dilation` can either be:\\\\n\\\\n \
    \       - a single ``int`` -- in which case the same value is used for the depth,\
    \ height and width dimension\\\\n        - a ``tuple`` of three ints -- in which\
    \ case, the first `int` is used for the depth dimension,\\\\n          the second\
    \ `int` for the height dimension and the third `int` for the width dimension\\\
    \\n\\\\n    Note:\\\\n        {depthwise_separable_note}\\\\n\\\\n    Note:\\\\\
    n        {cudnn_reproducibility_note}\\\\n\\\\n    Note:\\\\n        ``padding=\\\
    'valid\\'`` is the same as no padding. ``padding=\\'same\\'`` pads\\\\n      \
    \  the input so the output has the shape as the input. However, this mode\\\\\
    n        doesn\\'t support any stride values other than 1.\\\\n\\\\n    Note:\\\
    \\n        This module supports complex data types i.e. ``complex32, complex64,\
    \ complex128``.\\\\n\\\\n    Args:\\\\n        in_channels (int): Number of channels\
    \ in the input image\\\\n        out_channels (int): Number of channels produced\
    \ by the convolution\\\\n        kernel_size (int or tuple): Size of the convolving\
    \ kernel\\\\n        stride (int or tuple, optional): Stride of the convolution.\
    \ Default: 1\\\\n        padding (int, tuple or str, optional): Padding added\
    \ to all six sides of\\\\n            the input. Default: 0\\\\n        dilation\
    \ (int or tuple, optional): Spacing between kernel elements. Default: 1\\\\n \
    \       groups (int, optional): Number of blocked connections from input channels\
    \ to output channels. Default: 1\\\\n        bias (bool, optional): If ``True``,\
    \ adds a learnable bias to the output. Default: ``True``\\\\n        padding_mode\
    \ (str, optional): ``\\'zeros\\'``, ``\\'reflect\\'``, ``\\'replicate\\'`` or\
    \ ``\\'circular\\'``. Default: ``\\'zeros\\'``\\\\n    \".format(**reproducibility_notes,\
    \ **convolution_notes) + \\'\\\\n\\\\n    Shape:\\\\n        - Input: :math:`(N,\
    \ C_{in}, D_{in}, H_{in}, W_{in})` or :math:`(C_{in}, D_{in}, H_{in}, W_{in})`\\\
    \\n        - Output: :math:`(N, C_{out}, D_{out}, H_{out}, W_{out})` or :math:`(C_{out},\
    \ D_{out}, H_{out}, W_{out})`,\\\\n          where\\\\n\\\\n          .. math::\\\
    \\n              D_{out} = \\\\\\\\left\\\\\\\\lfloor\\\\\\\\frac{D_{in} + 2 \\\
    \\\\\\times \\\\\\\\text{padding}[0] - \\\\\\\\text{dilation}[0]\\\\n        \
    \            \\\\\\\\times (\\\\\\\\text{kernel\\\\\\\\_size}[0] - 1) - 1}{\\\\\
    \\\\text{stride}[0]} + 1\\\\\\\\right\\\\\\\\rfloor\\\\n\\\\n          .. math::\\\
    \\n              H_{out} = \\\\\\\\left\\\\\\\\lfloor\\\\\\\\frac{H_{in} + 2 \\\
    \\\\\\times \\\\\\\\text{padding}[1] - \\\\\\\\text{dilation}[1]\\\\n        \
    \            \\\\\\\\times (\\\\\\\\text{kernel\\\\\\\\_size}[1] - 1) - 1}{\\\\\
    \\\\text{stride}[1]} + 1\\\\\\\\right\\\\\\\\rfloor\\\\n\\\\n          .. math::\\\
    \\n              W_{out} = \\\\\\\\left\\\\\\\\lfloor\\\\\\\\frac{W_{in} + 2 \\\
    \\\\\\times \\\\\\\\text{padding}[2] - \\\\\\\\text{dilation}[2]\\\\n        \
    \            \\\\\\\\times (\\\\\\\\text{kernel\\\\\\\\_size}[2] - 1) - 1}{\\\\\
    \\\\text{stride}[2]} + 1\\\\\\\\right\\\\\\\\rfloor\\\\n\\\\n    Attributes:\\\
    \\n        weight (Tensor): the learnable weights of the module of shape\\\\n\
    \                         :math:`(\\\\\\\\text{out\\\\\\\\_channels}, \\\\\\\\\
    frac{\\\\\\\\text{in\\\\\\\\_channels}}{\\\\\\\\text{groups}},`\\\\n         \
    \                :math:`\\\\\\\\text{kernel\\\\\\\\_size[0]}, \\\\\\\\text{kernel\\\
    \\\\\\_size[1]}, \\\\\\\\text{kernel\\\\\\\\_size[2]})`.\\\\n                \
    \         The values of these weights are sampled from\\\\n                  \
    \       :math:`\\\\\\\\mathcal{U}(-\\\\\\\\sqrt{k}, \\\\\\\\sqrt{k})` where\\\\\
    n                         :math:`k = \\\\\\\\frac{groups}{C_\\\\\\\\text{in} *\
    \ \\\\\\\\prod_{i=0}^{2}\\\\\\\\text{kernel\\\\\\\\_size}[i]}`\\\\n        bias\
    \ (Tensor):   the learnable bias of the module of shape (out_channels). If :attr:`bias`\
    \ is ``True``,\\\\n                         then the values of these weights are\\\
    \\n                         sampled from :math:`\\\\\\\\mathcal{U}(-\\\\\\\\sqrt{k},\
    \ \\\\\\\\sqrt{k})` where\\\\n                         :math:`k = \\\\\\\\frac{groups}{C_\\\
    \\\\\\text{in} * \\\\\\\\prod_{i=0}^{2}\\\\\\\\text{kernel\\\\\\\\_size}[i]}`\\\
    \\n\\\\n    Examples::\\\\n\\\\n        >>> # With square kernels and equal stride\\\
    \\n        >>> m = nn.Conv3d(16, 33, 3, stride=2)\\\\n        >>> # non-square\
    \ kernels and unequal stride and with padding\\\\n        >>> m = nn.Conv3d(16,\
    \ 33, (3, 5, 2), stride=(2, 1, 1), padding=(4, 2, 0))\\\\n        >>> input =\
    \ torch.randn(20, 16, 10, 50, 100)\\\\n        >>> output = m(input)\\\\n\\\\\
    n    .. _cross-correlation:\\\\n        https://en.wikipedia.org/wiki/Cross-correlation\\\
    \\n\\\\n    .. _link:\\\\n        https://github.com/vdumoulin/conv_arithmetic/blob/master/README.md\\\
    \\n    \\')```'"
