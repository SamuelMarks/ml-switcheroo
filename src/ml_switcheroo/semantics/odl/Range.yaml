- default: 0
  is_variadic: false
  kind: positional_or_keyword
  name: start
  type: float
- is_variadic: false
  kind: positional_or_keyword
  name: end
  type: float
- default: 1
  is_variadic: false
  kind: positional_or_keyword
  name: step
  type: float
variants: {}
operation: Range
