operation: AdamW
description: Implements AdamW algorithm, where weight decay does not accumulate in
  the momentum nor variance.
std_args:
- name: params
  kind: positional_or_keyword
  is_variadic: false
  type: Any
- name: lr
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
  default: '0.001'
- name: betas
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
  default: (0.9, 0.999)
- name: eps
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: 1e-08
- name: weight_decay
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: '0.01'
- name: amsgrad
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'False'
- name: maximize
  kind: keyword_only
  is_variadic: false
  type: bool
  default: 'False'
- name: foreach
  kind: keyword_only
  is_variadic: false
  type: Any
  default: '''```(None)```'''
- name: capturable
  kind: keyword_only
  is_variadic: false
  type: bool
  default: 'False'
- name: differentiable
  kind: keyword_only
  is_variadic: false
  type: bool
  default: 'False'
- name: fused
  kind: keyword_only
  is_variadic: false
  type: Any
  default: '''```(None)```'''
variants:
  torch:
    api: torch.optim.AdamW
    args:
      params: params
  jax:
    api: optax.adamw
    args:
      learning_rate: learning_rate
  mlx:
    api: mlx.optimizers.AdamW
    args:
      learning_rate: learning_rate
  keras:
    api: keras.optimizers.AdamW
    args: {}
