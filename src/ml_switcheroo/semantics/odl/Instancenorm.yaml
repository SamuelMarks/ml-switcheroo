  kind: positional_or_keyword
  is_variadic: false
  type: int
- name: eps
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: 1e-05
- name: affine
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'False'
variants:
