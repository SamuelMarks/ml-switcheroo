description: Finds the indices into ``x1`` such that, if the corresponding elements
  in ``x2`` were inserted before the indices, the order of ``x1``, when sorted in
  ascending order, would be preserved.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: array
- is_variadic: false
  kind: positional_or_keyword
  name: side
  type: Literal[left, right]
- is_variadic: false
  kind: positional_or_keyword
  name: sorter
  type: Optional[array]
variants: {}
operation: searchsorted
