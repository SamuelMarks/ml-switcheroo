operation: MultiHeadAttention
description: Implements the scaled dot product attention with multiple heads.
std_args:
- name: dims
  kind: positional_or_keyword
  is_variadic: false
  type: int
- name: num_heads
  kind: positional_or_keyword
  is_variadic: false
  type: int
- name: query_input_dims
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''dims'''
- name: key_input_dims
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''dims'''
- name: value_input_dims
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''key_input_dims'''
- name: value_dims
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''dims'''
- name: value_output_dims
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''dims'''
- name: bias
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: 'False'
variants:
  mlx:
    api: mlx.nn.MultiHeadAttention
    args:
      dims: dims
      num_heads: num_heads
  keras:
    api: keras.layers.MultiHeadAttention
    args:
      num_heads: num_heads
      key_dim: key_dim
  torch:
    api: torch.nn.MultiheadAttention
    args:
      dims: embed_dim
      num_heads: num_heads
  flax_nnx:
    api: flax.nnx.MultiHeadAttention
    args:
      num_heads: num_heads
      dims: in_features
  nvidia_sass:
    api: Macro.MultiheadAttention
    args: {}
  rdna:
    api: ; Macro.MultiheadAttention
    args: {}
