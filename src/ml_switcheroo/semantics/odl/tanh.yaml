description: Calculates an implementation-dependent approximation to the hyperbolic
  tangent for each element ``x_i`` of the input array ``x``.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x
  type: array
type: function
operation: tanh
variants:
  keras:
    api: keras.activations.tanh
  numpy:
    api: numpy.tanh
  mlx:
    api: mlx.nn.Tanh
  latex_dsl:
    api: latex.tanh
  dask:
    api: dask.array.tanh
  torch:
    api: torch.nn.Tanh
  tensorflow:
    api: tf.nn.tanh
