  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: positive
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: negative
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: margin
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: '1.0'
- name: p
  kind: positional_or_keyword
