operation: Cdist
description: Computes batched the p-norm distance between each pair of the two collections
  of row vectors.
std_args:
- name: x1
  kind: positional_or_keyword
  is_variadic: false
  type: int
- name: x2
  kind: positional_or_keyword
  is_variadic: false
  type: int
- name: p
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: '2.0'
- name: compute_mode
  kind: positional_or_keyword
  is_variadic: false
  type: str
  default: '''use_mm_for_euclid_dist_if_necessary'''
variants:
  torch:
    api: torch.cdist
    args:
      x1: x1
      x2: x2
