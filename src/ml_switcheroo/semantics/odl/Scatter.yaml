  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: scatter_list
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
  default: '''```(None)```'''
- name: src
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''```(None)```'''
- name: group
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''```(None)```'''
- name: async_op
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: 'False'
- name: group_src
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: '''```(None)```'''
