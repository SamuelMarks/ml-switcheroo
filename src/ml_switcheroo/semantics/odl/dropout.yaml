operation: dropout
description: During training, randomly zeroes some elements of the input tensor with
  probability :attr:`p`.
std_args:
- name: p
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: '0.5'
- name: training
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'True'
- name: inplace
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'False'
- name: input
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
variants:
  torch:
    api: torch.nn.functional.dropout
    args:
      input: input
  flax_nnx:
    api: flax.nnx.Dropout
    args: {}
  mlx:
    api: mlx.nn.Dropout
    args: {}
  keras:
    api: keras.layers.Dropout
    args: {}
