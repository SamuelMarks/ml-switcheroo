  default: '-1.0'
- name: recall_target
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: '0.95'
- name: reduction_input_size_override
  kind: positional_or_keyword
  is_variadic: false
  type: int
  default: '-1'
- name: aggregate_to_topk
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'True'
variants:
