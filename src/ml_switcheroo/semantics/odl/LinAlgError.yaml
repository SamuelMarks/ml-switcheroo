description: "Error raised by torch.linalg function when the cause of error is a numerical\
  \ inconsistency in the data.\n For example, you can the torch.linalg.inv function\
  \ will raise torch.linalg.LinAlgError when it finds that a matrix is not invertible.\n\
  \ \nExample:\n >>> # xdoctest: +REQUIRES(env:TORCH_DOCKTEST_LAPACK)\n >>> matrix\
  \ = torch.eye(3, 3)\n >>> matrix[-1, -1] = 0\n >>> matrix\n     tensor([[1., 0.,\
  \ 0.],\n             [0., 1., 0.],\n             [0., 0., 0.]])\n >>> torch.linalg.inv(matrix)\n\
  \ Traceback (most recent call last):\n File \"<stdin>\", line 1, in <module>\n torch._C._LinAlgError:\
  \ torch.linalg.inv: The diagonal element 3 is zero, the inversion\n could not be\
  \ completed because the input matrix is singular."
std_args: []
variants: {}
operation: LinAlgError
