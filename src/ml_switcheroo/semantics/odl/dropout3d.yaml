operation: dropout3d
description: Randomly zero out entire channels (a channel is a 3D feature map).
std_args:
- name: p
  kind: positional_or_keyword
  is_variadic: false
  type: float
  default: '0.5'
- name: training
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'True'
- name: inplace
  kind: positional_or_keyword
  is_variadic: false
  type: bool
  default: 'False'
- name: input
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
variants:
  torch:
    api: torch.nn.functional.dropout3d
    args:
      input: input
  mlx:
    api: mlx.nn.Dropout3d
    args: {}
