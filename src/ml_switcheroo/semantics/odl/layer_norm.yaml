  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: normalized_shape
  kind: positional_or_keyword
  is_variadic: false
  type: Any
- name: weight
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
  default: '''```(None)```'''
- name: bias
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
  default: '''```(None)```'''
- name: eps
  kind: positional_or_keyword
