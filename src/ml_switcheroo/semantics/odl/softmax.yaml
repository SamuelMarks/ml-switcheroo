  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: dim
  kind: positional_or_keyword
  is_variadic: false
  type: Any
- name: _stacklevel
  kind: positional_or_keyword
  is_variadic: false
  type: int
  default: '3'
- name: dtype
  kind: positional_or_keyword
  is_variadic: false
  type: Any
variants:
  torch:
    api: torch.nn.functional.softmax
    args:
      input: input
  jax:
    api: jax.nn.softmax
    args:
      x: x
  mlx:
    api: mlx.core.softmax
    args:
      a: a
  keras:
    api: keras.activations.softmax
    args:
      x: x
  rdna:
    api: ; Macro.Softmax
    args: {}
  nvidia_sass:
    api: Macro.Softmax
    args: {}
  ir:
    api: Softmax
    args:
      input: input
      dim: axis
