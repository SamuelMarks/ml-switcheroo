operation: minimum
description: minimum(input, other, *, out=None) -> Tensor
std_args:
- name: input
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: other
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: out
  kind: keyword_only
  is_variadic: false
  type: Tensor
variants:
  torch:
    api: torch.minimum
    args:
      input: input
      other: other
  jax:
    api: jax.numpy.minimum
    macro_template: jax.numpy.minimum({input}, {other})
    args: {}
  mlx:
    api: mlx.core.minimum
    args:
      a: a
      b: b
  stablehlo:
    api: stablehlo.minimum
    args:
      lhs: lhs
      rhs: rhs
  keras:
    api: keras.ops.minimum
    args:
      x1: x1
      x2: x2
