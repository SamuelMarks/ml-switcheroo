- name: negative
  kind: positional_or_keyword
  is_variadic: false
  type: Tensor
- name: distance_function
  kind: keyword_only
  is_variadic: false
  type: Tensor
  default: '''```(None)```'''
- name: margin
  kind: keyword_only
