- name: __doc__
  kind: positional_or_keyword
  is_variadic: false
  type: Any
  default: "\"```('Applies a 3D transposed convolution operator over an input image\
    \ composed of several input\\\\n    planes.\\\\n    The transposed convolution\
    \ operator multiplies each input value element-wise by a learnable kernel,\\\\\
    n    and sums over the outputs from all input feature planes.\\\\n\\\\n    This\
    \ module can be seen as the gradient of Conv3d with respect to its input.\\\\\
    n    It is also known as a fractionally-strided convolution or\\\\n    a deconvolution\
    \ (although it is not an actual deconvolution operation as it does\\\\n    not\
    \ compute a true inverse of convolution). For more information, see the visualizations\\\
    \\n    `here`_ and the `Deconvolutional Networks`_ paper.\\\\n\\\\n    This module\
    \ supports :ref:`TensorFloat32<tf32_on_ampere>`.\\\\n\\\\n    On certain ROCm\
    \ devices, when using float16 inputs this module will use :ref:`different precision<fp16_on_mi200>`\
    \ for backward.\\\\n\\\\n    * :attr:`stride` controls the stride for the cross-correlation.\\\
    \\n\\\\n    * :attr:`padding` controls the amount of implicit zero padding on\
    \ both\\\\n      sides for ``dilation * (kernel_size - 1) - padding`` number of\
    \ points. See note\\\\n      below for details.\\\\n\\\\n    * :attr:`output_padding`\
    \ controls the additional size added to one side\\\\n      of the output shape.\
    \ See note below for details.\\\\n\\\\n    * :attr:`dilation` controls the spacing\
    \ between the kernel points; also known as the \xE0 trous algorithm.\\\\n    \
    \  It is harder to describe, but the link `here`_ has a nice visualization of\
    \ what :attr:`dilation` does.\\\\n\\\\n    {groups_note}\\\\n\\\\n    The parameters\
    \ :attr:`kernel_size`, :attr:`stride`, :attr:`padding`, :attr:`output_padding`\\\
    \\n    can either be:\\\\n\\\\n        - a single ``int`` -- in which case the\
    \ same value is used for the depth, height and width dimensions\\\\n        -\
    \ a ``tuple`` of three ints -- in which case, the first `int` is used for the\
    \ depth dimension,\\\\n          the second `int` for the height dimension and\
    \ the third `int` for the width dimension\\\\n\\\\n    Note:\\\\n        The :attr:`padding`\
    \ argument effectively adds ``dilation * (kernel_size - 1) - padding``\\\\n  \
    \      amount of zero padding to both sizes of the input. This is set so that\\\
    \\n        when a :class:`~torch.nn.Conv3d` and a :class:`~torch.nn.ConvTranspose3d`\\\
    \\n        are initialized with same parameters, they are inverses of each other\
    \ in\\\\n        regard to the input and output shapes. However, when ``stride\
    \ > 1``,\\\\n        :class:`~torch.nn.Conv3d` maps multiple input shapes to the\
    \ same output\\\\n        shape. :attr:`output_padding` is provided to resolve\
    \ this ambiguity by\\\\n        effectively increasing the calculated output shape\
    \ on one side. Note\\\\n        that :attr:`output_padding` is only used to find\
    \ output shape, but does\\\\n        not actually add zero-padding to output.\\\
    \\n\\\\n    Note:\\\\n        {cudnn_reproducibility_note}\\\\n\\\\n    Args:\\\
    \\n        in_channels (int): Number of channels in the input image\\\\n     \
    \   out_channels (int): Number of channels produced by the convolution\\\\n  \
    \      kernel_size (int or tuple): Size of the convolving kernel\\\\n        stride\
    \ (int or tuple, optional): Stride of the convolution. Default: 1\\\\n       \
    \ padding (int or tuple, optional): ``dilation * (kernel_size - 1) - padding``\
    \ zero-padding\\\\n            will be added to both sides of each dimension in\
    \ the input. Default: 0\\\\n        output_padding (int or tuple, optional): Additional\
    \ size added to one side\\\\n            of each dimension in the output shape.\
    \ Default: 0\\\\n        groups (int, optional): Number of blocked connections\
    \ from input channels to output channels. Default: 1\\\\n        bias (bool, optional):\
    \ If ``True``, adds a learnable bias to the output. Default: ``True``\\\\n   \
    \     dilation (int or tuple, optional): Spacing between kernel elements. Default:\
    \ 1\\\\n    '.format(**reproducibility_notes, **convolution_notes) + '\\\\n\\\\\
    n    Shape:\\\\n        - Input: :math:`(N, C_{in}, D_{in}, H_{in}, W_{in})` or\
    \ :math:`(C_{in}, D_{in}, H_{in}, W_{in})`\\\\n        - Output: :math:`(N, C_{out},\
    \ D_{out}, H_{out}, W_{out})` or\\\\n          :math:`(C_{out}, D_{out}, H_{out},\
    \ W_{out})`, where\\\\n\\\\n        .. math::\\\\n              D_{out} = (D_{in}\
    \ - 1) \\\\\\\\times \\\\\\\\text{stride}[0] - 2 \\\\\\\\times \\\\\\\\text{padding}[0]\
    \ + \\\\\\\\text{dilation}[0]\\\\n                        \\\\\\\\times (\\\\\\\
    \\text{kernel\\\\\\\\_size}[0] - 1) + \\\\\\\\text{output\\\\\\\\_padding}[0]\
    \ + 1\\\\n        .. math::\\\\n              H_{out} = (H_{in} - 1) \\\\\\\\\
    times \\\\\\\\text{stride}[1] - 2 \\\\\\\\times \\\\\\\\text{padding}[1] + \\\\\
    \\\\text{dilation}[1]\\\\n                        \\\\\\\\times (\\\\\\\\text{kernel\\\
    \\\\\\_size}[1] - 1) + \\\\\\\\text{output\\\\\\\\_padding}[1] + 1\\\\n      \
    \  .. math::\\\\n              W_{out} = (W_{in} - 1) \\\\\\\\times \\\\\\\\text{stride}[2]\
    \ - 2 \\\\\\\\times \\\\\\\\text{padding}[2] + \\\\\\\\text{dilation}[2]\\\\n\
    \                        \\\\\\\\times (\\\\\\\\text{kernel\\\\\\\\_size}[2] -\
    \ 1) + \\\\\\\\text{output\\\\\\\\_padding}[2] + 1\\\\n\\\\n\\\\n    Attributes:\\\
    \\n        weight (Tensor): the learnable weights of the module of shape\\\\n\
    \                         :math:`(\\\\\\\\text{in\\\\\\\\_channels}, \\\\\\\\\
    frac{\\\\\\\\text{out\\\\\\\\_channels}}{\\\\\\\\text{groups}},`\\\\n        \
    \                 :math:`\\\\\\\\text{kernel\\\\\\\\_size[0]}, \\\\\\\\text{kernel\\\
    \\\\\\_size[1]}, \\\\\\\\text{kernel\\\\\\\\_size[2]})`.\\\\n                \
    \         The values of these weights are sampled from\\\\n                  \
    \       :math:`\\\\\\\\mathcal{U}(-\\\\\\\\sqrt{k}, \\\\\\\\sqrt{k})` where\\\\\
    n                         :math:`k = \\\\\\\\frac{groups}{C_\\\\\\\\text{out}\
    \ * \\\\\\\\prod_{i=0}^{2}\\\\\\\\text{kernel\\\\\\\\_size}[i]}`\\\\n        bias\
    \ (Tensor):   the learnable bias of the module of shape (out_channels)\\\\n  \
    \                       If :attr:`bias` is ``True``, then the values of these\
    \ weights are\\\\n                         sampled from :math:`\\\\\\\\mathcal{U}(-\\\
    \\\\\\sqrt{k}, \\\\\\\\sqrt{k})` where\\\\n                         :math:`k =\
    \ \\\\\\\\frac{groups}{C_\\\\\\\\text{out} * \\\\\\\\prod_{i=0}^{2}\\\\\\\\text{kernel\\\
    \\\\\\_size}[i]}`\\\\n\\\\n    Examples::\\\\n\\\\n        >>> # With square kernels\
    \ and equal stride\\\\n        >>> m = nn.ConvTranspose3d(16, 33, 3, stride=2)\\\
    \\n        >>> # non-square kernels and unequal stride and with padding\\\\n \
    \       >>> m = nn.ConvTranspose3d(16, 33, (3, 5, 2), stride=(2, 1, 1), padding=(0,\
    \ 4, 2))\\\\n        >>> input = torch.randn(20, 16, 10, 50, 100)\\\\n       \
    \ >>> output = m(input)\\\\n\\\\n    .. _`here`:\\\\n        https://github.com/vdumoulin/conv_arithmetic/blob/master/README.md\\\
    \\n\\\\n    .. _`Deconvolutional Networks`:\\\\n        https://www.matthewzeiler.com/mattzeiler/deconvolutionalnetworks.pdf\\\
    \\n    ')```\""
