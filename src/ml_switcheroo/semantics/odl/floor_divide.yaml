description: Rounds the result of dividing each element ``x1_i`` of the input array
  ``x1`` by the respective element ``x2_i`` of the input array ``x2`` to the greatest
  (i.e., closest to `+infinity`) integer-value number that is not greater than the
  division result.
std_args:
- is_variadic: false
  kind: positional_or_keyword
  name: x1
  type: Union[array, int, float]
- is_variadic: false
  kind: positional_or_keyword
  name: x2
  type: Union[array, int, float]
variants: {}
operation: floor_divide
