Function:
  description: "Base class to create custom autograd.Function.\n\nTo create a custom\
    \ autograd.Function, subclass this class and implement\nthe :meth:forward and\
    \ :meth:backward static methods. Then, to use your custom\nop in the forward pass,\
    \ call the class method apply. Do not call\n:meth:forward directly.\n\nTo ensure\
    \ correctness and best performance, make sure you are calling the\ncorrect methods\
    \ on ctx and validating your backward function using\n:func:torch.autograd.gradcheck.\n\
