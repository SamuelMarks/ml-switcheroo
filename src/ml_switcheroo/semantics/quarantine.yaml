    \n    >>> # xdoctest: +REQUIRES(env:TORCH_DOCTEST_AUTOGRAD)\n    >>> class Exp(Function):\n\
    \    >>>     @staticmethod\n    >>>     def forward(ctx, i):\n    >>>        \
    \ result = i.exp()\n    >>>         ctx.save_for_backward(result)\n    >>>   \
    \      return result\n    >>>\n    >>>     @staticmethod\n    >>>     def backward(ctx,\
    \ grad_output):\n    >>>         result, = ctx.saved_tensors\n    >>>        \
    \ return grad_output * result\n    >>>\n    >>> # Use it by calling the apply\
